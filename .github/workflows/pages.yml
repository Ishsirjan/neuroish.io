name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve public URL
        id: site
        run: |
          NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$NAME" == *.github.io ]]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${NAME}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${OWNER}.github.io/${NAME}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
